spring:
  application:
    name: knowledge-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
  flyway:
    enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health
nacos:
  discovery:
    server-addr: ${NACOS_SERVER_ADDR:}
knowledge:
  evaluation:
    base-url: ${KNOWLEDGE_EVALUATION_BASE_URL:http://localhost:8085}
logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-} requestId=%X{requestId:-} tenantId=%X{tenantId:-} service=knowledge-service]"
